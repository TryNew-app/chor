<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Chor">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#7a2e3a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Chorverwaltung</title>
<style>
:root{--bg:#f4f1ee;--card:#fff;--fg:#1d1b1a;--mute:#76706b;--acc:#7a2e3a;--line:#e3ddd8;--on:#2f7d4f;--danger:#c0392b;--hl:#fff0cf;--hlb:#e0a030;--g1:#ffe49a;--g2:#e4e8ee;--g3:#f4d3b4}
@media(prefers-color-scheme:dark){:root{--bg:#161413;--card:#232020;--fg:#f1ece8;--mute:#a39b95;--acc:#c9586a;--line:#38332f;--on:#3a9a62;--danger:#e5675a;--hl:#4a3a18;--hlb:#d9a441;--g1:#5c4a14;--g2:#3d424a;--g3:#583c25}}
*{box-sizing:border-box}
body{margin:0;font:17px/1.4 -apple-system,system-ui,sans-serif;background:var(--bg);color:var(--fg);padding-bottom:calc(92px + env(safe-area-inset-bottom));-webkit-text-size-adjust:100%}
#app{max-width:900px;margin:0 auto;padding:max(16px,env(safe-area-inset-top)) 16px 16px}
h1{font-size:28px;margin:6px 0}
h2{font-size:19px;margin:0}
.muted{color:var(--mute);font-size:15px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sp{flex:1;min-width:0}
.card{background:var(--card);border-radius:14px;padding:14px 16px;margin:10px 0}
.card.hl{background:var(--hl);border:2px solid var(--hlb)}
input,select{font:inherit;color:var(--fg);background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px}
input[type=text],input:not([type]){width:100%}
input[type=date]{min-width:0;max-width:100%}
textarea{font:inherit;color:var(--fg);background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;margin-top:10px}
input[type=time]{min-width:130px}
.btn{font:inherit;background:var(--acc);color:#fff;border:0;border-radius:12px;padding:11px 18px;min-height:44px}
.btn.sec{background:transparent;color:var(--acc);border:1.5px solid var(--acc)}
.btn.danger{background:transparent;color:var(--danger);border:1.5px solid var(--danger)}
.btn.small{padding:6px 12px;min-height:36px;font-size:15px}
.btn.wide{width:100%;margin:10px 0}
.btn:disabled{opacity:.35}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;gap:4px;background:var(--card);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:10}
nav button{flex:1;min-width:0;position:relative;background:none;border:0;border-radius:12px;font:inherit;font-size:11px;color:var(--mute);padding:6px 1px;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button span{font-size:22px;line-height:1.2}
nav button.on{background:var(--acc);color:#fff;font-weight:600}
.dot{display:none;position:absolute;top:1px;left:calc(50% + 9px);width:13px;height:13px;border-radius:50%;background:#ff3b30;border:2px solid #fff}
.dot.on{display:block}
.dotin{display:inline-block;width:11px;height:11px;border-radius:50%;background:#ff3b30;margin-right:6px}
.ev{display:flex;align-items:center;gap:12px;width:100%;text-align:left;font:inherit;color:inherit;background:var(--card);border:0;border-radius:14px;padding:14px 16px;margin:8px 0;min-height:64px}
.ev .box{width:28px;height:28px;flex:none;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;color:transparent;font-size:18px}
.ev.on .box{background:var(--on);border-color:var(--on);color:#fff}
.badge{display:inline-block;font-size:13px;padding:2px 10px;border-radius:99px;background:var(--bg);color:var(--mute);border:1px solid var(--line)}
.badge.konzert{background:var(--acc);color:#fff;border-color:var(--acc)}
.badge.gottesdienst{background:#2f5d8a;color:#fff;border-color:#2f5d8a}
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px;margin:8px 0 16px}
.chip{display:flex;align-items:center;gap:6px;font:inherit;font-size:16px;font-weight:500;padding:0 10px;height:54px;min-width:0;overflow:hidden;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--fg);text-align:left}
.chip .ck{width:1.1em;flex:none;visibility:hidden}
.chip .t{flex:1;min-width:0;overflow:hidden;text-overflow:clip}
.chip .tt{display:inline-block;white-space:nowrap}
.chip.on{background:var(--on);border-color:var(--on);color:#fff}
.chip.on .ck{visibility:visible}
.count b{font-size:30px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.grid .card{margin:0}
.big{font-size:34px;font-weight:700}
table{width:100%;border-collapse:collapse}
td{padding:8px 6px;border-bottom:1px solid var(--line)}
td:last-child,td:nth-child(3){text-align:right}
tr.r1 td{background:var(--g1)}
tr.r2 td{background:var(--g2)}
tr.r3 td{background:var(--g3)}
tr.r1 td:first-child,tr.r2 td:first-child,tr.r3 td:first-child{border-radius:8px 0 0 8px}
tr.r1 td:last-child,tr.r2 td:last-child,tr.r3 td:last-child{border-radius:0 8px 8px 0}
.piece{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.piece span{flex:1}
.piece b{min-width:28px}
.warn{border:1.5px solid var(--danger)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:8px}
.flag{font-weight:600;margin-top:4px}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:12px 0}
.fgrid>label,.fgrid>div{display:block;min-width:0;font-size:15px;color:var(--mute)}
.fgrid input,.fgrid select{display:block;width:100%;min-width:0;max-width:100%;margin-top:4px}
.dwrap{display:flex;gap:8px;align-items:center;margin-top:4px}
.dwrap input{margin-top:0;flex:1}
.fgrid .hint{align-self:end;padding-bottom:12px}
@media(max-width:480px){.fgrid{grid-template-columns:minmax(0,1fr)}}
.fm{display:grid;grid-template-columns:minmax(0,1.5fr) repeat(3,minmax(0,1fr)) minmax(0,1.3fr) auto;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-size:15px}
.fm.hd{color:var(--mute);font-size:13px;padding-top:0}
.fm .lb{display:none;color:var(--mute)}
.fm .act{display:flex;gap:6px;justify-content:flex-end}
@media(max-width:760px){.fm{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.fm.hd{display:none}.fm .nm{grid-column:1/-1;font-size:17px}.fm .lb{display:inline}.fm .act{grid-column:1/-1;justify-content:flex-start}}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:50;overflow:auto;padding:max(16px,env(safe-area-inset-top)) 16px 24px}
.sheet{max-width:560px;margin:0 auto;background:var(--card);border-radius:16px;padding:14px}
.sheet img{width:100%;display:block;border-radius:10px}
</style>
</head>
<body>
<div id="app"></div>
<nav>
  <button data-t="termine"><span>📅</span>Termine</button>
  <button data-t="statistik"><span>📊</span>Statistik</button>
  <button data-t="auftritte"><span>🎤</span>Auftritte</button>
  <button data-t="mitglieder"><span>👥</span>Mitglieder</button>
  <button data-t="jubilaeen"><span>🎂</span>Jubiläen<i class="dot"></i></button>
  <button data-t="sicherung"><span>💾</span>Sicherung</button>
</nav>
<script>
const KEY='chor-data-v1';
const VOICES=['Sopran','Alt','Tenor','Bass'];
const TYPES={probe:'Probe',konzert:'Konzert',gottesdienst:'Gottesdienst'};
const SOON=30; // so viele Tage vorher wird ein runder Geburtstag hervorgehoben
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const fmt=d=>new Date(d+'T12:00:00').toLocaleDateString('de-DE',{weekday:'short',day:'2-digit',month:'2-digit',year:'numeric'});
const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0;
const f1=n=>n.toLocaleString('de-DE',{maximumFractionDigits:1});
const pct=n=>Math.round(n*100)+' %';

/* ---------- Namen: Vorname und Nachname ---------- */
const dn=m=>m.last&&m.first?m.last+', '+m.first:(m.last||m.first||'(ohne Namen)');
const byName=(a,b)=>(a.last||'').localeCompare(b.last||'','de')||(a.first||'').localeCompare(b.first||'','de');
function normMember(m){
  let first=m.first,last=m.last;
  if(first===undefined&&last===undefined){ // ältere Daten: ein Namensfeld -> letztes Wort = Nachname
    const p=String(m.name||'').trim().split(/\s+/).filter(Boolean);
    last=p.length?p.pop():'';first=p.join(' ');
  }
  m.first=first||'';m.last=last||'';m.left=m.left||'';
  m.name=(m.first+' '+m.last).trim();
  return m;
}
const normGig=g=>({title:'',location:'',note:'',times:[],pieces:[],...g});

function load(){try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&Array.isArray(d.members)&&Array.isArray(d.events)){d.members.forEach(normMember);d.gigs=(Array.isArray(d.gigs)?d.gigs:[]).map(normGig);return d}}catch(e){}return{members:[],events:[],gigs:[]}}
let db=load();
function save(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){alert('Speichern ist fehlgeschlagen. Bitte mache eine Sicherung.')}}
let ui={tab:'termine',year:new Date().getFullYear(),eventId:null,showNew:false,editMember:null,showNewMember:false,gigId:null,showNewGig:false,listMode:false,listSel:[],listPieces:false,listTitle:'Termine Jakobuschor',shareImg:null,lastVoice:'Sopran',focus:null};

const isFormer=m=>!!m.left&&m.left<=today();
const inChoir=(m,d)=>(!m.joined||m.joined<=d)&&(!m.left||d<=m.left);
const activeMembers=()=>db.members.filter(m=>m.active!==false&&!isFormer(m));
const getEvent=()=>db.events.find(e=>e.id===ui.eventId);
const getGig=()=>db.gigs.find(g=>g.id===ui.gigId);
const presentCount=e=>e.present.filter(id=>db.members.some(m=>m.id===id)).length;
const presentOfVoice=(e,v)=>e.present.filter(id=>{const m=db.members.find(x=>x.id===id);return m&&m.voice===v}).length;
function years(){const s=new Set([new Date().getFullYear()]);db.events.forEach(e=>s.add(+e.date.slice(0,4)));return[...s].sort((a,b)=>b-a)}
const yearSelect=()=>`<select data-c="year" aria-label="Jahr">${years().map(v=>`<option ${v==ui.year?'selected':''}>${v}</option>`).join('')}</select>`;
const typeOptions=sel=>Object.entries(TYPES).map(([k,l])=>`<option value="${k}" ${k===sel?'selected':''}>${l}</option>`).join('');

/* ---------- Datums-Helfer ---------- */
const startOfToday=()=>{const d=new Date();return new Date(d.getFullYear(),d.getMonth(),d.getDate())};
const pd=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const fmtD=s=>pd(s).toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit',year:'numeric'});
const fmtDM=d=>d.toLocaleDateString('de-DE',{day:'numeric',month:'long'});
const dayText=d=>d===0?'heute':d===1?'morgen':`in ${d} Tagen`;
const agoText=d=>d===0?'heute':d===1?'gestern':`vor ${d} Tagen`;
function span(from,to){ // volle Jahre und Monate zwischen zwei Daten
  let months=(to.getFullYear()-from.getFullYear())*12+to.getMonth()-from.getMonth();
  if(to.getDate()<from.getDate())months--;
  if(months<0)months=0;
  return{y:Math.floor(months/12),m:months%12};
}
function nextOcc(s,t){ // nächster Jahrestag ab heute
  const b=pd(s);
  let n=new Date(t.getFullYear(),b.getMonth(),b.getDate());
  if(n<t)n=new Date(t.getFullYear()+1,b.getMonth(),b.getDate());
  return{date:n,n:n.getFullYear()-b.getFullYear(),days:Math.round((n-t)/864e5)};
}
function lastOcc(s,t){ // letzter Jahrestag bis heute
  const b=pd(s);
  let n=new Date(t.getFullYear(),b.getMonth(),b.getDate());
  if(n>t)n=new Date(t.getFullYear()-1,b.getMonth(),b.getDate());
  return{date:n,n:n.getFullYear()-b.getFullYear(),days:Math.round((t-n)/864e5)};
}
function recentBirthdays(){ // Geburtstage heute und in den letzten 7 Tagen
  const t=startOfToday();
  return db.members.filter(m=>!isFormer(m)&&m.birth).map(m=>({m,...lastOcc(m.birth,t)})).filter(x=>x.days<=7).sort((a,b)=>a.days-b.days||byName(a.m,b.m));
}
const spanText=s=>s.y===0?`${s.m} Monate`:`${s.y} Jahre${s.m?`, ${s.m} Monat${s.m>1?'e':''}`:''}`;

/* ---------- Termine ---------- */
function viewTermine(){
  const y=String(ui.year);
  const ev=db.events.filter(e=>e.date.startsWith(y)).sort((a,b)=>b.date.localeCompare(a.date));
  const c=t=>ev.filter(e=>e.type===t).length;
  let h=`<div class="row"><h1 class="sp">Termine</h1>${yearSelect()}</div>`;
  h+=`<div class="muted">${y}: ${c('probe')} Proben · ${c('konzert')} Konzerte · ${c('gottesdienst')} Gottesdienste · ${ev.length} gesamt</div>`;
  if(!db.members.length)h+=`<div class="card">Tipp: Lege zuerst unter „Mitglieder“ deine Sängerinnen und Sänger an.</div>`;
  if(ui.showNew){
    h+=`<div class="card"><h2>Neuer Termin</h2>
      <div class="row" style="margin:10px 0"><input type="date" id="nDate" value="${today()}"><select id="nType">${typeOptions('probe')}</select></div>
      <input id="nTitle" placeholder="Titel oder Ort (optional)" autocomplete="off">
      <div class="row" style="margin-top:12px"><button class="btn" data-a="create">Anlegen</button><button class="btn sec" data-a="cancelnew">Abbrechen</button></div></div>`;
  }else h+=`<button class="btn wide" data-a="new">+ Neuer Termin</button>`;
  if(!ev.length)h+=`<div class="muted" style="margin-top:16px">Noch keine Termine in ${y}.</div>`;
  h+=ev.map(e=>`<button class="ev" data-a="open" data-id="${e.id}">
    <div class="sp"><div><b>${fmt(e.date)}</b></div><div class="muted">${esc(e.title)||''}${e.pieces.length?` · ${e.pieces.length} Stück${e.pieces.length>1?'e':''}`:''}</div></div>
    <span class="badge ${e.type}">${TYPES[e.type]}</span><b style="min-width:70px;text-align:right">${presentCount(e)} 👥</b></button>`).join('');
  return h;
}

const eligibleFor=(e,v)=>db.members.filter(m=>m.voice===v&&((m.active!==false&&inChoir(m,e.date))||e.present.includes(m.id))).sort(byName);
function viewEvent(){
  const e=getEvent();if(!e){ui.eventId=null;return viewTermine()}
  const pres=new Set(e.present);
  const allPieces=[...new Set(db.events.flatMap(x=>x.pieces))].sort((a,b)=>a.localeCompare(b,'de'));
  let h=`<button class="btn sec small" data-a="back">‹ Zurück</button>
  <div class="card"><div class="row" style="margin-bottom:10px"><select data-c="evtype">${typeOptions(e.type)}</select><input type="date" data-c="evdate" value="${e.date}"></div>
  <input data-c="evtitle" placeholder="Titel oder Ort (optional)" value="${esc(e.title)}" autocomplete="off"></div>
  <div class="card count"><b>${presentCount(e)}</b> anwesend<div class="muted">${VOICES.map(v=>v+' '+presentOfVoice(e,v)).join(' · ')}</div></div>`;
  for(const v of VOICES){
    const ms=eligibleFor(e,v);
    h+=`<div class="row" style="margin-top:14px"><h2 class="sp">${v} <span class="muted">${presentOfVoice(e,v)}/${ms.length}</span></h2>
      <button class="btn sec small" data-a="all" data-v="${v}">alle</button><button class="btn sec small" data-a="none" data-v="${v}">keine</button></div>`;
    h+=ms.length?`<div class="chips">${ms.map(m=>`<button class="chip ${pres.has(m.id)?'on':''}" data-a="toggle" data-id="${m.id}"><span class="ck">✓</span><span class="t"><span class="tt">${esc(dn(m))}</span></span></button>`).join('')}</div>`:`<div class="muted" style="margin:6px 0 12px">Keine Mitglieder in dieser Stimme.</div>`;
  }
  h+=`<div class="card"><h2>${e.type==='probe'?'Geprobte Stücke':'Gesungene Stücke'}</h2>
    ${e.pieces.map((p,i)=>`<div class="piece"><span>${esc(p)}</span><button class="btn danger small" data-a="delpiece" data-i="${i}">✕</button></div>`).join('')}
    <div class="row" style="margin-top:10px"><input id="pInput" class="sp" list="pList" placeholder="Stück hinzufügen" autocomplete="off"><datalist id="pList">${allPieces.map(p=>`<option value="${esc(p)}">`).join('')}</datalist><button class="btn" data-a="addpiece">Hinzufügen</button></div></div>
  <button class="btn danger wide" data-a="delevent">Termin löschen</button>`;
  return h;
}

/* Schrift in den Namensfeldern verkleinern, bis der Name hineinpasst (das Feld bleibt gleich groß) */
function fitChips(){
  document.querySelectorAll('.chip .t').forEach(box=>{
    const tt=box.firstElementChild;if(!tt)return;
    const room=()=>box.clientWidth-2; // 2 px Reserve, gemessen wird auf Bruchteile von Pixeln genau
    tt.style.display='inline-block';tt.style.whiteSpace='nowrap';tt.style.lineHeight='';tt.style.overflowWrap='';
    let s=16;box.style.fontSize=s+'px';
    while(tt.getBoundingClientRect().width>room()&&s>11){s-=0.5;box.style.fontSize=s+'px'}
    if(tt.getBoundingClientRect().width>room()){ // sehr langer Name: zwei kleine Zeilen im selben Feld
      tt.style.display='block';tt.style.whiteSpace='normal';tt.style.lineHeight='1.15';tt.style.overflowWrap='anywhere';
      s=14;box.style.fontSize=s+'px';
      while(tt.getBoundingClientRect().height>44&&s>8){s-=0.5;box.style.fontSize=s+'px'}
    }
  });
}

/* ---------- Auftritte ---------- */
const GTYPES={gottesdienst:'Gottesdienst',konzert:'Konzert',sonstiges:'Sonstiges'};
const fmtTime=t=>{if(!t)return'';const [h,m]=t.split(':');return (+h)+':'+m+' Uhr'};
const longDate=d=>new Date(d+'T12:00:00').toLocaleDateString('de-DE',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
const timeLine=t=>[t.label,fmtTime(t.time)].filter(Boolean).join(' ');
const gigTitle=g=>g.title||GTYPES[g.type]||'Auftritt';
const listGigs=()=>db.gigs.filter(g=>ui.listSel.includes(g.id)).sort((a,b)=>a.date.localeCompare(b.date));

function gigCard(g){
  return `<button class="ev" data-a="opengig" data-id="${g.id}">
    <div class="sp"><div><b>${esc(gigTitle(g))}</b></div><div class="muted">${fmt(g.date)}${g.location?' · '+esc(g.location):''}</div></div>
    <span class="badge ${g.type}">${GTYPES[g.type]||'Sonstiges'}</span></button>`;
}
function viewGigs(){
  if(ui.listMode)return viewGigList();
  const t=today();
  const up=db.gigs.filter(g=>g.date>=t).sort((a,b)=>a.date.localeCompare(b.date));
  const past=db.gigs.filter(g=>g.date<t).sort((a,b)=>b.date.localeCompare(a.date));
  let h=`<h1>Auftritte</h1><div class="muted">Gottesdienste, Konzerte und andere Auftritte planen und als Bild oder Text teilen.</div>`;
  if(ui.showNewGig){
    h+=`<div class="card"><h2>Neuer Auftritt</h2>
      <div class="row" style="margin:10px 0"><select id="gType">${Object.entries(GTYPES).map(([k,l])=>`<option value="${k}">${l}</option>`).join('')}</select><input type="date" id="gDate" value="${today()}"></div>
      <input id="gTitle" placeholder="Titel (z. B. Adventskonzert)" autocomplete="off">
      <div class="row" style="margin-top:12px"><button class="btn" data-a="creategig">Anlegen</button><button class="btn sec" data-a="cancelnewgig">Abbrechen</button></div></div>`;
  }else h+=`<div class="row" style="margin:12px 0"><button class="btn sp" data-a="newgig">+ Neuer Auftritt</button>${db.gigs.length?'<button class="btn sec" data-a="listmode">Liste teilen</button>':''}</div>`;
  if(!db.gigs.length)h+=`<div class="muted" style="margin-top:16px">Noch keine Auftritte angelegt.</div>`;
  if(up.length)h+=`<h2 style="margin-top:18px">Anstehend</h2>`+up.map(gigCard).join('');
  if(past.length)h+=`<h2 style="margin-top:18px">Vergangen</h2>`+past.map(gigCard).join('');
  return h;
}
function viewGigList(){
  const t=today();
  const all=[...db.gigs].sort((a,b)=>a.date.localeCompare(b.date));
  const up=all.filter(g=>g.date>=t),past=all.filter(g=>g.date<t).reverse();

function applyGigField(el){
  const c=el.dataset.c;
  if(!/^g(type|title|date|loc|note|time|label)$/.test(c))return false;
  const g=getGig();if(!g)return true;
  const i=+el.dataset.i;
  if(c==='gtype')g.type=el.value;
  else if(c==='gtitle')g.title=el.value;
  else if(c==='gdate'){if(el.value)g.date=el.value}
  else if(c==='gloc')g.location=el.value;
  else if(c==='gnote')g.note=el.value;
  else if(c==='gtime'&&g.times[i])g.times[i].time=el.value;
  else if(c==='glabel'&&g.times[i])g.times[i].label=el.value;
  save();return true;
}

/* Bild für WhatsApp: wird auf einer Zeichenfläche gemalt, braucht kein Internet */
const FONT='-apple-system,"Helvetica Neue",Helvetica,Arial,sans-serif';
function gigCanvas(g){
  const W=1080,P=72,CW=W-2*P,F=FONT;
  const c=document.createElement('canvas');c.width=W;c.height=300;
  const ctx=c.getContext('2d');
  const set=(sz,wt)=>{ctx.font=(wt||400)+' '+sz+'px '+F;ctx.textBaseline='top'};
  const wrap=(t,w)=>{
    const out=[];
    String(t).split('\n').forEach(par=>{
      const words=par.split(/\s+/).filter(Boolean);
      if(!words.length){out.push('');return}
      let line='';
      words.forEach(wd=>{const tst=line?line+' '+wd:wd;if(ctx.measureText(tst).width>w&&line){out.push(line);line=wd}else line=tst});
      out.push(line);
    });
    return out;
  };
  const title=gigTitle(g),dateTxt=longDate(g.date);
  const times=(g.times||[]).filter(t=>t.time||t.label);
  const pieces=g.pieces||[];
  function run(draw){
    const txt=(s,x,y,col)=>{if(draw){ctx.fillStyle=col;ctx.fillText(s,x,y)}};
    set(66,700);const tl=wrap(title,CW);
    const head=P+34+16+tl.length*78+14+46+Math.round(P*.7);
    if(draw){ctx.fillStyle='#faf6f1';ctx.fillRect(0,0,W,c.height);ctx.fillStyle='#7a2e3a';ctx.fillRect(0,0,W,head)}
    let y=P;
    set(30,700);txt((GTYPES[g.type]||'Auftritt').toUpperCase(),P,y,'#e8c27a');y+=34+16;
    set(66,700);tl.forEach((l,i)=>txt(l,P,y+i*78,'#ffffff'));y+=tl.length*78+14;
    set(40,400);txt(dateTxt,P,y,'#f3e3cf');
    y=head+Math.round(P*.7);
    const section=n=>{set(28,700);txt(n.toUpperCase(),P,y,'#7a2e3a');y+=28+18};
    if(times.length){
      section('Zeiten');
      times.forEach(t=>{
        const tt=fmtTime(t.time),x0=tt?P+250:P;
        set(40,400);const ll=wrap(t.label||'',CW-(x0-P));
        set(40,700);txt(tt,P,y,'#1d1b1a');
        set(40,400);ll.forEach((l,i)=>txt(l,x0,y+i*52,'#1d1b1a'));
        y+=Math.max(1,ll.length)*52+10;
      });
      y+=30;
    }
    if(g.location){section('Ort');set(40,400);wrap(g.location,CW).forEach(l=>{txt(l,P,y,'#1d1b1a');y+=52});y+=30}
    if(pieces.length){
      section('Stücke');
      pieces.forEach((p,i)=>{
        set(40,400);const pl=wrap(p,CW-70);
        set(40,700);txt((i+1)+'.',P,y,'#7a2e3a');
        set(40,400);pl.forEach((l,k)=>txt(l,P+70,y+k*52,'#1d1b1a'));
        y+=pl.length*52+10;
      });
      y+=30;
    }
    if(g.note){section('Hinweise');set(36,400);wrap(g.note,CW).forEach(l=>{txt(l,P,y,'#444444');y+=48});y+=30}
    return y+Math.round(P*.3);
  }
  const H=Math.ceil(run(false));
  c.height=H;
  run(true);
  return c;
}
/* Mehrere Auftritte als Liste in einem Bild */
function gigListCanvas(gigs,opt){
  const W=1080,P=64,IN=30,CW=W-2*P-IN,F=FONT;
  const c=document.createElement('canvas');c.width=W;c.height=300;
  const ctx=c.getContext('2d');
  const set=(sz,wt)=>{ctx.font=(wt||400)+' '+sz+'px '+F;ctx.textBaseline='top'};
  const wrap=(t,w)=>{
    const out=[];
    String(t).split('\n').forEach(par=>{
      const words=par.split(/\s+/).filter(Boolean);
      if(!words.length){out.push('');return}
      let line='';
      words.forEach(wd=>{const tst=line?line+' '+wd:wd;if(ctx.measureText(tst).width>w&&line){out.push(line);line=wd}else line=tst});
      out.push(line);
    });
    return out;
  };
  const items=gigs.slice().sort((a,b)=>a.date.localeCompare(b.date));
  const head=(opt&&opt.title)||'Auftritte';
  function run(draw){
    const txt=(s,x,y,col)=>{if(draw){ctx.fillStyle=col;ctx.fillText(s,x,y)}};
    set(52,700);const tl=wrap(head,W-2*P);
    const headH=38+tl.length*62+38;
    if(draw){ctx.fillStyle='#faf6f1';ctx.fillRect(0,0,W,c.height);ctx.fillStyle='#7a2e3a';ctx.fillRect(0,0,W,headH)}
    set(52,700);tl.forEach((l,i)=>txt(l,P,38+i*62,'#ffffff'));
    let y=headH+44;
    items.forEach((g,idx)=>{
      const y0=y;const x=P+IN;
      set(32,700);wrap(longDate(g.date),CW).forEach(l=>{txt(l,x,y,'#7a2e3a');y+=42});
      set(44,700);wrap(gigTitle(g),CW).forEach(l=>{txt(l,x,y,'#1d1b1a');y+=56});
      const times=(g.times||[]).filter(t=>t.time||t.label);
      set(34,400);
      if(times.length)wrap(times.map(t=>[fmtTime(t.time),t.label].filter(Boolean).join(' ')).join('   ·   '),CW).forEach(l=>{txt(l,x,y,'#1d1b1a');y+=46});
      if(g.location){set(34,400);wrap('Ort: '+g.location,CW).forEach(l=>{txt(l,x,y,'#1d1b1a');y+=46})}
      if(opt&&opt.pieces&&(g.pieces||[]).length){
        y+=6;
        g.pieces.forEach((p,i)=>{
          set(32,400);const pl=wrap(p,CW-56);
          set(32,700);txt((i+1)+'.',x,y,'#7a2e3a');
          set(32,400);pl.forEach((l,k)=>txt(l,x+56,y+k*42,'#555555'));
          y+=pl.length*42;
        });
      }
      if(draw){ctx.fillStyle='#7a2e3a';ctx.fillRect(P,y0+4,8,Math.max(10,y-y0-10))}
      y+=26;
      if(idx<items.length-1){if(draw){ctx.fillStyle='#e3ddd8';ctx.fillRect(P,y,W-2*P,2)}y+=34}
    });
    return y+Math.round(P*.5);
  }
  const H=Math.ceil(run(false));
  c.height=H;
  run(true);
  return c;
}
function gigText(g){
  const L=['*'+gigTitle(g)+'*',longDate(g.date)];
  (g.times||[]).filter(t=>t.time||t.label).forEach(t=>L.push(timeLine(t)));
  if(g.location)L.push('Ort: '+g.location);
  if((g.pieces||[]).length){L.push('','Stücke:');g.pieces.forEach((p,i)=>L.push((i+1)+'. '+p))}
  if(g.note)L.push('',g.note);
  return L.join('\n');
}
function gigListText(gigs,opt){
  const L=['*'+((opt&&opt.title)||'Auftritte')+'*'];
  gigs.slice().sort((a,b)=>a.date.localeCompare(b.date)).forEach(g=>{
    L.push('','*'+longDate(g.date)+'*',gigTitle(g));
    (g.times||[]).filter(t=>t.time||t.label).forEach(t=>L.push(timeLine(t)));
    if(g.location)L.push('Ort: '+g.location);
    if(opt&&opt.pieces&&(g.pieces||[]).length){g.pieces.forEach((p,i)=>L.push((i+1)+'. '+p))}
  });
  return L.join('\n');
}

/* ---------- Jubiläen ---------- */
function viewJub(){
  const t=startOfToday();
  const info=db.members.filter(m=>!isFormer(m)).sort(byName).map(m=>{
    const o={m};
    if(m.birth){o.age=span(pd(m.birth),t).y;o.nb=nextOcc(m.birth,t)}
    if(m.joined){o.ch=span(pd(m.joined),t);o.nj=nextOcc(m.joined,t)}
    o.bRound=!!o.nb&&o.nb.n%5===0&&o.nb.n>=10&&o.nb.days<=SOON;
    // Chorjubiläum: das ganze Kalenderjahr hervorgehoben, in dem ein runder Jahrestag liegt
    if(m.joined){const j=pd(m.joined);const dt=new Date(t.getFullYear(),j.getMonth(),j.getDate());o.jy={n:t.getFullYear()-j.getFullYear(),date:dt,days:Math.round((dt-t)/864e5)}}
    o.jRound=!!o.jy&&o.jy.n%5===0&&o.jy.n>=5;
    return o;
  });
  const soon=[];
  info.forEach(o=>{
    if(o.bRound)soon.push({d:o.nb.days,date:o.nb.date,icon:'🎂',t:`${esc(dn(o.m))} wird ${o.nb.n}`});
    if(o.jRound)soon.push({d:o.jy.days,date:o.jy.date,icon:'🎶',t:`${esc(dn(o.m))}: ${o.jy.n} Jahre im Chor`});
  });
  soon.sort((a,b)=>(a.d<0)-(b.d<0)||(a.d<0?b.d-a.d:a.d-b.d));
  const rb=recentBirthdays();
  let h=`<h1>Jubiläen</h1><div class="muted">Runde Geburtstage (alle 5 Jahre) werden ${SOON} Tage vorher hervorgehoben, runde Chorjahre (alle 5 Jahre) das ganze Jahr.</div>`;
  if(rb.length)h+=`<div class="card"><h2><span class="dotin"></span>Geburtstag in den letzten 7 Tagen</h2>${rb.map(x=>`<div class="piece"><span>🎂 <b>${esc(dn(x.m))}</b> wurde ${x.n}<div class="muted">${fmtDM(x.date)} · ${agoText(x.days)}</div></span></div>`).join('')}</div>`;
  if(soon.length)h+=`<div class="card hl"><h2>Runde Termine</h2>${soon.map(s=>`<div class="piece"><span>${s.icon} <b>${s.t}</b><div class="muted">${fmtDM(s.date)} · ${s.d<0?'schon erreicht':dayText(s.d)}</div></span></div>`).join('')}</div>`;
  if(!info.length)h+=`<div class="card muted">Noch keine Mitglieder. Lege sie unter „Mitglieder“ an.</div>`;
  h+=info.map(o=>{
    const chTxt=o.ch?spanText(o.ch)+' im Chor':'';
    return `<div class="card ${o.bRound||o.jRound?'hl':''}">
      <div class="row"><b class="sp">${esc(dn(o.m))}</b>${o.m.active===false?'<span class="badge">pausiert</span>':''}<span class="badge">${o.m.voice}</span></div>
      <div class="two">
        <div><div class="muted">Geburtstag</div>
          ${o.m.birth?`<div>${fmtD(o.m.birth)}</div><div>${o.age} Jahre alt</div>${o.bRound?`<div class="flag">🎂 wird ${o.nb.n} am ${fmtDM(o.nb.date)} (${dayText(o.nb.days)})</div>`:''}`:`<div class="muted">nicht eingetragen</div>`}</div>
        <div><div class="muted">Chor-Eintritt</div>
          ${o.m.joined?`<div>${fmtD(o.m.joined)}</div><div>${chTxt}</div>${o.jRound?`<div class="flag">🎶 ${o.jy.n} Jahre ${o.jy.days>=0?`am ${fmtDM(o.jy.date)} (${dayText(o.jy.days)})`:`erreicht am ${fmtDM(o.jy.date)}`}</div>`:''}`:`<div class="muted">nicht eingetragen</div>`}</div>
      </div></div>`;
  }).join('');
  return h;
}

function viewStats(){

  const ev=db.events.filter(e=>e.date.startsWith(y));

  const prAvg=avg(pr.map(presentCount));
  // Wer zählt bei einer Probe mit? Aktive Mitglieder, die an dem Tag im Chor waren, dazu jeder, der anwesend war.
  const elig=e=>db.members.filter(m=>(m.active!==false&&inChoir(m,e.date))||e.present.includes(m.id));
  const slots=pr.reduce((s,e)=>s+elig(e).length,0);
  const got=pr.reduce((s,e)=>s+presentCount(e),0);
  const c=t=>ev.filter(e=>e.type===t).length;
  let h=`<div class="row"><h1 class="sp">Statistik</h1>${yearSelect()}</div>`;
  h+=`<div class="grid">`+[['Proben',c('probe')],['Konzerte',c('konzert')],['Gottesdienste',c('gottesdienst')],['Gesamt',ev.length]].map(([l,n])=>`<div class="card"><div class="muted">${l} ${y}</div><div class="big">${n}</div></div>`).join('')+`</div>`;
  h+=`<div class="card"><div class="muted">Probenbeteiligung ${y} (nur Proben)</div>
    <div class="big">${slots?pct(got/slots):'–'}</div>
    <div class="muted">${pr.length?`Ø ${f1(prAvg)} Sänger pro Probe bei Ø ${f1(slots/pr.length)} Mitgliedern (${pr.length} Proben). Neue Mitglieder zählen ab ihrem Chor-Eintritt, ehemalige bis zu ihrem Austritt.`:'Noch keine Proben in diesem Jahr.'}</div></div>`;
  h+=`<h2 style="margin-top:20px">Proben nach Stimme</h2><div class="card"><table>`+VOICES.map(v=>{
    const n=activeMembers().filter(m=>m.voice===v).length;
    const a=avg(pr.map(e=>presentOfVoice(e,v)));
    const sl=pr.reduce((s,e)=>s+elig(e).filter(m=>m.voice===v).length,0);
    const g=pr.reduce((s,e)=>s+presentOfVoice(e,v),0);
    return `<tr><td>${v}</td><td class="muted">${n} Mitglied${n===1?'':'er'}</td><td>${pr.length?'Ø '+f1(a)+(sl?' ('+pct(g/sl)+')':''):'–'}</td></tr>`}).join('')+`</table></div>`;
  // Anwesenheit pro Mitglied: höchster Anteil zuerst, die besten drei Prozentwerte farbig
  const rows=db.members.filter(m=>pr.some(e=>e.present.includes(m.id))||(m.active!==false&&(!m.joined||m.joined<=y+'-12-31')&&(!m.left||m.left>=y+'-01-01'))).map(m=>{
    const n=pr.filter(e=>e.present.includes(m.id)).length;
    const tot=pr.filter(e=>e.present.includes(m.id)||inChoir(m,e.date)).length;
    return{m,n,tot,p:tot?Math.round(n/tot*100):-1};
  }).sort((a,b)=>b.p-a.p||b.n-a.n||byName(a.m,b.m));
  const top=[...new Set(rows.filter(r=>r.p>0).map(r=>r.p))].slice(0,3);
  h+=`<h2 style="margin-top:20px">Anwesenheit pro Mitglied</h2><div class="muted">Sortiert nach Anteil der besuchten Proben. Farbig: die drei besten Werte (bei Gleichstand auch mehr als drei Personen).</div><div class="card">`+(rows.length?`<table><tr class="muted"><td>Name</td><td>Stimme</td><td>Proben</td><td>Anteil</td></tr>`+rows.map(r=>{
    const k=top.indexOf(r.p);
    return `<tr class="${k>=0?'r'+(k+1):''}"><td>${esc(dn(r.m))}</td><td class="muted">${r.m.voice}</td><td>${r.n}/${r.tot}</td><td>${r.tot?r.p+' %':'–'}</td></tr>`}).join('')+`</table>`:`<span class="muted">Keine Daten.</span>`)+`</div>`;
  const cnt={};ev.filter(e=>e.type!=='probe').forEach(e=>e.pieces.forEach(p=>cnt[p]=(cnt[p]||0)+1));
  const ps=Object.entries(cnt).sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0],'de'));
  h+=`<h2 style="margin-top:20px">Stücke bei Auftritten</h2><div class="card">`+(ps.length?`<table>`+ps.map(([p,n])=>`<tr><td>${esc(p)}</td><td>${n}×</td></tr>`).join('')+`</table>`:`<span class="muted">Noch keine Stücke eingetragen.</span>`)+`</div>`;
  return h;
}

/* ---------- Sicherung ---------- */
const lastBackup=()=>{try{return localStorage.getItem('chor-backup')}catch(e){return null}};
function viewBackup(){
  const lb=lastBackup();
  const old=!lb||(Date.now()-new Date(lb+'T12:00:00'))/864e5>30;
  return `<h1>Sicherung</h1>
  <div class="card ${old?'warn':''}"><b>Letzte Sicherung:</b> ${lb?fmt(lb):'noch nie'}<div class="muted" style="margin-top:6px">Deine Daten liegen nur auf diesem Gerät. Mache regelmäßig eine Sicherung, zum Beispiel einmal im Monat.</div></div>
  <div class="card"><h2>Sicherung erstellen</h2><div class="muted" style="margin:6px 0 12px">Es öffnet sich das Teilen-Menü. Wähle dort „In Dateien sichern“ oder schicke die Datei per AirDrop oder Mail an dich selbst.</div><button class="btn" data-a="export">Sicherung erstellen</button></div>
  <div class="card"><h2>Sicherung einspielen</h2><div class="muted" style="margin:6px 0 12px">Ersetzt alle Daten auf diesem Gerät durch die der Sicherungsdatei. Damit kannst du die Daten auch auf ein anderes Gerät übertragen.</div><input type="file" data-c="import" accept=".json,application/json"></div>
  <div class="muted" style="text-align:center;margin-top:20px">${db.members.length} Mitglieder · ${db.events.length} Termine · ${db.gigs.length} Auftritte gespeichert</div>`;
}
function markBackup(){try{localStorage.setItem('chor-backup',today())}catch(e){}}
async function doExport(){
  const json=JSON.stringify({app:'chorverwaltung',version:1,exported:new Date().toISOString(),members:db.members,events:db.events,gigs:db.gigs},null,1);
  const name='chor-sicherung-'+today()+'.json';
  const file=new File([json],name,{type:'application/json'});
  try{
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:name});markBackup();render();return}
  }catch(err){if(err&&err.name==='AbortError')return}
  const a=document.createElement('a');a.href=URL.createObjectURL(file);a.download=name;document.body.appendChild(a);a.click();a.remove();
  markBackup();render();
}
function doImport(file){
  if(!file)return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const d=JSON.parse(r.result);
      if(!Array.isArray(d.members)||!Array.isArray(d.events))throw 0;
      if(!confirm(`Alle aktuellen Daten ersetzen durch ${d.members.length} Mitglieder, ${d.events.length} Termine und ${(d.gigs||[]).length} Auftritte?`))return;
      db={members:d.members.map(normMember),events:d.events.map(e=>({present:[],pieces:[],title:'',...e})),gigs:(Array.isArray(d.gigs)?d.gigs:[]).map(normGig)};save();render();alert('Sicherung eingespielt.');
    }catch(e){alert('Diese Datei ist keine gültige Sicherung.')}
  };
  r.readAsText(file);
}

/* ---------- Render & Events ---------- */
function render(){
  const y=window.scrollY;
  const v=ui.eventId?viewEvent:ui.gigId?viewGig:{termine:viewTermine,auftritte:viewGigs,mitglieder:viewMembers,jubilaeen:viewJub,statistik:viewStats,sicherung:viewBackup}[ui.tab];
  $('#app').innerHTML=v()+shareOverlay();
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===ui.tab));
  const dot=document.querySelector('nav [data-t="jubilaeen"] .dot');
  if(dot)dot.classList.toggle('on',recentBirthdays().length>0);
  fitChips();
  window.scrollTo(0,y);
  if(ui.focus){const el=$(ui.focus);if(el)el.focus();ui.focus=null}
}

document.addEventListener('click',ev=>{
  const t=ev.target.closest('[data-t]');
  if(t){ui.tab=t.dataset.t;ui.eventId=null;ui.showNew=false;ui.editMember=null;ui.showNewMember=false;ui.gigId=null;ui.showNewGig=false;ui.listMode=false;closeShare();window.scrollTo(0,0);render();return}
  const b=ev.target.closest('[data-a]');if(!b)return;
  const a=b.dataset.a,id=b.dataset.id,e=getEvent(),g=getGig();
  if(a==='new'){ui.showNew=true}
  else if(a==='cancelnew'){ui.showNew=false}
  else if(a==='create'){
    const date=$('#nDate').value;if(!date){alert('Bitte ein Datum wählen.');return}
    const n={id:uid(),date,type:$('#nType').value,title:$('#nTitle').value.trim(),present:[],pieces:[]};
    db.events.push(n);save();ui.eventId=n.id;ui.showNew=false;ui.year=+date.slice(0,4);window.scrollTo(0,0);
  }
  else if(a==='open'){ui.eventId=id;window.scrollTo(0,0)}
  else if(a==='back'){ui.eventId=null;window.scrollTo(0,0)}
  else if(a==='toggle'&&e){e.present=e.present.includes(id)?e.present.filter(x=>x!==id):[...e.present,id];save()}
  else if(a==='all'&&e){const ids=db.members.filter(m=>m.voice===b.dataset.v&&m.active!==false&&inChoir(m,e.date)).map(m=>m.id);e.present=[...new Set([...e.present,...ids])];save()}
  else if(a==='none'&&e){const ids=new Set(db.members.filter(m=>m.voice===b.dataset.v).map(m=>m.id));e.present=e.present.filter(x=>!ids.has(x));save()}
  else if(a==='addpiece'&&e){const i=$('#pInput'),p=i.value.trim();if(!p)return;e.pieces.push(p);save();ui.focus='#pInput'}
  else if(a==='delpiece'&&e){e.pieces.splice(+b.dataset.i,1);save()}
  else if(a==='delevent'&&e){if(!confirm('Diesen Termin wirklich löschen?'))return;db.events=db.events.filter(x=>x.id!==e.id);save();ui.eventId=null}
  else if(a==='addmember'){
    const first=$('#mFirst').value.trim(),last=$('#mLast').value.trim();
    if(!first&&!last){alert('Bitte Vor- und Nachnamen eingeben.');return}
    ui.lastVoice=$('#mVoice').value;
    db.members.push(normMember({id:uid(),first,last,voice:ui.lastVoice,birth:$('#mBirth').value||'',joined:$('#mJoined').value||'',left:$('#mLeft').value||'',active:true}));save();ui.showNewMember=false;
  }
  else if(a==='newmember'){ui.showNewMember=true;ui.focus='#mFirst'}
  else if(a==='cancelnewmember'){ui.showNewMember=false}
  else if(a==='editmember'){ui.editMember=id;ui.showNewMember=false;window.scrollTo(0,0)}
  else if(a==='canceledit'){ui.editMember=null}
  else if(a==='clearleft'){const i=$('#mLeft');if(i)i.value='';return}
  else if(a==='savemember'){
    const m=db.members.find(x=>x.id===ui.editMember);
    const first=$('#mFirst').value.trim(),last=$('#mLast').value.trim();
    if(!first&&!last){alert('Bitte Vor- und Nachnamen eingeben.');return}
    m.first=first;m.last=last;m.voice=$('#mVoice').value;m.birth=$('#mBirth').value||'';m.joined=$('#mJoined').value||'';m.left=$('#mLeft').value||'';normMember(m);save();ui.editMember=null;
  }
  else if(a==='togglemember'){const m=db.members.find(x=>x.id===id);m.active=m.active===false;save()}
  else if(a==='delmember'){
    const m=db.members.find(x=>x.id===id);
    if(!confirm(`${dn(m)} wirklich löschen? Die Anwesenheiten gehen dabei verloren. Tipp: „Pausieren“ oder ein Chor-Austritt behält alle Daten.`))return;
    if(ui.editMember===id)ui.editMember=null;
    db.members=db.members.filter(x=>x.id!==id);db.events.forEach(x=>x.present=x.present.filter(p=>p!==id));save();
  }
  else if(a==='newgig'){ui.showNewGig=true}
  else if(a==='cancelnewgig'){ui.showNewGig=false}
  else if(a==='creategig'){
    const date=$('#gDate').value;if(!date){alert('Bitte ein Datum wählen.');return}
    const n={id:uid(),type:$('#gType').value,title:$('#gTitle').value.trim(),date,location:'',times:[],pieces:[],note:''};
    db.gigs.push(n);save();ui.gigId=n.id;ui.showNewGig=false;window.scrollTo(0,0);
  }
  else if(a==='opengig'){ui.gigId=id;window.scrollTo(0,0)}
  else if(a==='backgig'){ui.gigId=null;window.scrollTo(0,0)}
  else if(a==='addtime'&&g){g.times.push({time:'',label:''});save()}
  else if(a==='deltime'&&g){g.times.splice(+b.dataset.i,1);save()}
  else if(a==='addgpiece'&&g){const p=$('#gpInput').value.trim();if(!p)return;g.pieces.push(p);save();ui.focus='#gpInput'}
  else if(a==='delgpiece'&&g){g.pieces.splice(+b.dataset.i,1);save()}
  else if(a==='upgpiece'&&g){const i=+b.dataset.i;if(i>0){[g.pieces[i-1],g.pieces[i]]=[g.pieces[i],g.pieces[i-1]];save()}}
  else if(a==='downgpiece'&&g){const i=+b.dataset.i;if(i<g.pieces.length-1){[g.pieces[i+1],g.pieces[i]]=[g.pieces[i],g.pieces[i+1]];save()}}
  else if(a==='delgig'&&g){if(!confirm('Diesen Auftritt wirklich löschen?'))return;db.gigs=db.gigs.filter(x=>x.id!==g.id);save();ui.gigId=null}
  else if(a==='gigimg'&&g){showCanvas(gigCanvas(g),'auftritt-'+g.date+'.png');return}
  else if(a==='gigtxt'&&g){shareText(gigText(g));return}
  else if(a==='listmode'){ui.listMode=true;ui.listSel=db.gigs.filter(x=>x.date>=today()).map(x=>x.id);window.scrollTo(0,0)}
  else if(a==='backlist'){ui.listMode=false;window.scrollTo(0,0)}
  else if(a==='tgllist'){ui.listSel=ui.listSel.includes(id)?ui.listSel.filter(x=>x!==id):[...ui.listSel,id]}
  else if(a==='tglpieces'){ui.listPieces=!ui.listPieces}
  else if(a==='listimg'){const gs=listGigs();if(gs.length)showCanvas(gigListCanvas(gs,{title:ui.listTitle,pieces:ui.listPieces}),'auftritte-liste.png');return}
  else if(a==='listtxt'){const gs=listGigs();if(gs.length)shareText(gigListText(gs,{title:ui.listTitle,pieces:ui.listPieces}));return}
  else if(a==='doshare'){shareFile();return}
  else if(a==='closeshare'){closeShare()}
  else if(a==='export'){doExport();return}
  render();
});
document.addEventListener('change',ev=>{
  const c=ev.target.dataset.c;if(!c)return;
  if(applyGigField(ev.target))return;
  if(c==='ltitle'){ui.listTitle=ev.target.value;return}
  const e=getEvent();
  if(c==='year'){ui.year=+ev.target.value}
  else if(c==='evdate'&&e){if(ev.target.value){e.date=ev.target.value;ui.year=+e.date.slice(0,4);save()}}
  else if(c==='evtype'&&e){e.type=ev.target.value;save()}
  else if(c==='evtitle'&&e){e.title=ev.target.value.trim();save();return}
  else if(c==='import'){doImport(ev.target.files[0]);return}
  render();
});
// Eingaben sofort speichern (ohne Neuzeichnen), damit nichts verloren geht
document.addEventListener('input',ev=>{
  const el=ev.target;if(!el.dataset||!el.dataset.c)return;
  if(applyGigField(el))return;
  if(el.dataset.c==='ltitle'){ui.listTitle=el.value;return}
  if(el.dataset.c==='evtitle'){const e=getEvent();if(e){e.title=el.value;save()}}
});
document.addEventListener('keydown',ev=>{
  if(ev.key!=='Enter')return;
  if(ev.target.id==='mFirst'||ev.target.id==='mLast'){const btn=document.querySelector('[data-a="addmember"],[data-a="savemember"]');if(btn)btn.click()}
  if(ev.target.id==='pInput')document.querySelector('[data-a="addpiece"]').click();
  if(ev.target.id==='gpInput')document.querySelector('[data-a="addgpiece"]').click();
});
window.addEventListener('resize',fitChips);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(fitChips);

try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
render();
</script>
